name: Original iOS fixed archive qualification
on:
  push:
    branches:
    - codex/original-ios-release
permissions:
  contents: read
concurrency:
  group: celluloid-platforms-refs/heads/codex/apple-platforms
  cancel-in-progress: false
env:
  CELLULOID_VALIDATION_SCOPE: original-ios-release
jobs:
  archive:
    permissions:
      contents: read
      actions: read
    name: Original iOS unsigned device Release package
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
    - name: Start the fixed archive clock
      shell: bash
      run: |
        python3 - <<'PYARCHIVECLOCK'
        import json,os,time
        from pathlib import Path
        Path(os.environ['RUNNER_TEMP'],'original-ios-archive-clock.json').write_text(json.dumps({
          'schema':'Celluloid.OriginalIOSArchiveClock.1','source_sha':os.environ['GITHUB_SHA'],
          'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
          'started_monotonic':time.monotonic(),'started_unix':time.time(),'execution_budget_seconds':1560}))
        PYARCHIVECLOCK
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      timeout-minutes: 2
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 6
    - name: Verify exact staged source and stable toolchain
      timeout-minutes: 2
      shell: bash
      run: |
        set -euo pipefail
        python3 Scripts/original_ios_archive.py admit --phase setup
        python3 Scripts/verify_combined_source.py --phase before
        xcodebuild -version | tee "$RUNNER_TEMP/full-shipping-xcode.txt"
        grep -Fx 'Xcode 27.0' "$RUNNER_TEMP/full-shipping-xcode.txt"
        python3 Scripts/generate_project.py
        python3 Scripts/validate_release.py
        PYTHONPATH=Scripts python3 -m unittest -v test_original_ios_optional_process_contract
        git diff --exit-code HEAD --
        python3 Scripts/original_ios_archive.py check-clock --phase setup
    - name: Verify six fixed qualified artifact identities within setup allocation
      timeout-minutes: 2
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        python3 Scripts/original_ios_archive.py admit --phase setup
        python3 Scripts/original_ios_fixed_rows.py metadata
        python3 Scripts/original_ios_archive.py check-clock --phase setup
    - name: Retrieve fixed 04d18 producer used by the three qualified rows
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      timeout-minutes: 1
      with:
        artifact-ids: 11397407111
        run-id: 37432040947
        repository: 100mango/Celluloid
        github-token: ${{ github.token }}
        merge-multiple: true
        path: ${{ runner.temp }}/original-ios-fixed-producers/04d18/
    - name: Admit fixed da9d producer retrieval
      shell: bash
      run: |
        python3 Scripts/original_ios_archive.py check-clock --phase setup
    - name: Retrieve fixed da9d producer used by qualified Mini
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      timeout-minutes: 1
      with:
        artifact-ids: 11401547686
        run-id: 37441448096
        repository: 100mango/Celluloid
        github-token: ${{ github.token }}
        merge-multiple: true
        path: ${{ runner.temp }}/original-ios-fixed-producers/da9d/
    - name: Admit fixed compact-phone evidence retrieval
      shell: bash
      run: |
        python3 Scripts/original_ios_archive.py check-clock --phase setup
    - name: Retrieve fixed qualified 04d18 compact-phone proof
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      timeout-minutes: 1
      with:
        artifact-ids: 11398344849
        run-id: 37432040947
        repository: 100mango/Celluloid
        github-token: ${{ github.token }}
        merge-multiple: true
        path: ${{ runner.temp }}/original-ios-rows/compact-phone/
    - name: Admit fixed large-phone evidence retrieval
      shell: bash
      run: |
        python3 Scripts/original_ios_archive.py check-clock --phase setup
    - name: Retrieve fixed qualified 04d18 large-phone proof
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      timeout-minutes: 1
      with:
        artifact-ids: 11397769097
        run-id: 37432040947
        repository: 100mango/Celluloid
        github-token: ${{ github.token }}
        merge-multiple: true
        path: ${{ runner.temp }}/original-ios-rows/large-phone/
    - name: Admit fixed small-ipad evidence retrieval
      shell: bash
      run: |
        python3 Scripts/original_ios_archive.py check-clock --phase setup
    - name: Retrieve fixed qualified da9d Mini proof
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      timeout-minutes: 1
      with:
        artifact-ids: 11403055944
        run-id: 37441448096
        repository: 100mango/Celluloid
        github-token: ${{ github.token }}
        merge-multiple: true
        path: ${{ runner.temp }}/original-ios-rows/small-ipad/
    - name: Admit fixed large-ipad evidence retrieval
      shell: bash
      run: |
        python3 Scripts/original_ios_archive.py check-clock --phase setup
    - name: Retrieve fixed qualified 04d18 large-ipad proof
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      timeout-minutes: 1
      with:
        artifact-ids: 11400355337
        run-id: 37432040947
        repository: 100mango/Celluloid
        github-token: ${{ github.token }}
        merge-multiple: true
        path: ${{ runner.temp }}/original-ios-rows/large-ipad/
    - name: Replay all four qualified rows with their exact original producers
      timeout-minutes: 2
      shell: bash
      run: |
        set -euo pipefail
        python3 Scripts/original_ios_archive.py admit --phase setup
        python3 Scripts/original_ios_rows.py --fixed-archive-only-rows
        python3 Scripts/original_ios_archive.py check-clock --phase setup
    - name: Archive original app framework and Photos extension for device Release
      id: build_archive
      timeout-minutes: 16
      shell: bash
      run: |
        set -euo pipefail
        seconds=$(python3 Scripts/original_ios_archive.py admit --phase archive)
        python3 Scripts/run_bounded.py --seconds "$seconds" --label original-iOS-device-archive xcodebuild -project Celluloid.xcodeproj -scheme Celluloid -configuration Release -destination 'generic/platform=iOS' -archivePath .build/Celluloid.xcarchive -derivedDataPath .build/ArchiveDerived -jobs 2 archive CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee "$RUNNER_TEMP/archive.log"
        python3 Scripts/original_ios_archive.py check-clock --phase archive
    - name: Verify actual unsigned package and public Mach-O dependency closure
      id: package_proof
      timeout-minutes: 4
      shell: bash
      run: |
        set -euo pipefail
        python3 Scripts/original_ios_archive.py admit --phase proof
        python3 Scripts/original_ios_archive.py verify
        python3 Scripts/original_ios_archive.py check-clock --phase proof
    - name: Recheck source and finalize package proof
      id: final_proof
      if: always()
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 Scripts/original_ios_archive.py admit --phase source
        python3 Scripts/verify_combined_source.py --phase after
        python3 Scripts/original_ios_archive.py finalize
        python3 Scripts/original_ios_archive.py check-clock --phase source
    - name: Retain fixed bounded package evidence
      id: archive_evidence
      if: always()
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 Scripts/original_ios_archive.py collect
        python3 Scripts/original_ios_archive.py check-clock --phase retention
    - name: Admit final bounded archive upload
      id: upload_admission
      if: always()
      shell: bash
      run: |
        python3 Scripts/original_ios_archive.py admit --phase upload
    - name: Upload unsigned package proof only
      id: archive_upload
      if: always() && steps.upload_admission.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      timeout-minutes: 1
      with:
        name: celluloid-original-ios-archive-${{ github.sha }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/celluloid-original-ios-archive-evidence/
        retention-days: 1
        if-no-files-found: error
    - name: Require complete original package evidence and final clock
      if: always()
      timeout-minutes: 1
      env:
        BUILD_OUTCOME: ${{ steps.build_archive.outcome }}
        PACKAGE_OUTCOME: ${{ steps.package_proof.outcome }}
        FINAL_OUTCOME: ${{ steps.final_proof.outcome }}
        RETENTION_OUTCOME: ${{ steps.archive_evidence.outcome }}
        UPLOAD_OUTCOME: ${{ steps.archive_upload.outcome }}
      shell: bash
      run: |
        set -euo pipefail
        python3 Scripts/original_ios_archive.py check-clock --phase upload
        for outcome in "$BUILD_OUTCOME" "$PACKAGE_OUTCOME" "$FINAL_OUTCOME" "$RETENTION_OUTCOME" "$UPLOAD_OUTCOME"; do test "$outcome" = success; done
