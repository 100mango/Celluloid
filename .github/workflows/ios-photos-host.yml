name: Celluloid protected and editable Photos host acceptance
on:
  push:
    branches: [codex/ios-photos-preservation-host]
permissions:
  contents: read
concurrency:
  group: celluloid-photos-preservation-host
  cancel-in-progress: false
jobs:
  host:
    name: Actual Photos protected output and editable restoration
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify frozen production source and test-only delta
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 100mango/Celluloid
          test "$GITHUB_REF" = refs/heads/codex/ios-photos-preservation-host
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          frozen='c5875ee7586611c28879b5030e5e575a9f33fcbd'
          allowed={'.github/workflows/ios-photos-host.yml','CelluloidUITests/CelluloidUITests.swift','Celluloid.xcodeproj/xcshareddata/xcschemes/CelluloidCapture.xcscheme'}
          changed=set(p for p in subprocess.check_output(['git','diff','--name-only','-z',frozen,'HEAD']).decode().split('\0') if p)
          assert changed and changed <= allowed,changed
          paths=[p for p in subprocess.check_output(['git','ls-files','-z','Celluloid','CelluloidKit','CelluloidPhotoExtension']).decode().split('\0') if p]
          rows=[]
          for p in paths:
              data=pathlib.Path(p).read_bytes()
              assert data==subprocess.check_output(['git','show',frozen+':'+p]),p
              rows.append((p,hashlib.sha256(data).hexdigest()))
          digest=hashlib.sha256(json.dumps(rows,separators=(',',':')).encode()).hexdigest()
          assert len(rows)==316 and digest=='a8e62778f438088e56e71f4ce6ea2570ecc74d115f810bbc9d36d0be6c0d8afe'
          settings=[p for p in subprocess.check_output(['git','ls-files','-z','*pbxproj','*xcworkspacedata','*Package.resolved']).decode().split('\0') if p]
          for p in settings:
              assert pathlib.Path(p).read_bytes()==subprocess.check_output(['git','show',frozen+':'+p]),p
          original=subprocess.check_output(['git','show',frozen+':CelluloidUITests/CelluloidUITests.swift'])
          assert pathlib.Path('CelluloidUITests/CelluloidUITests.swift').read_bytes().startswith(original),'Existing fail-closed suite/prefix changed'
          print('UNCHANGED_UI_TEST_PREFIX_SHA256',hashlib.sha256(original).hexdigest())
          print('FROZEN_PRODUCTION_SOURCE',frozen,'FILES',len(rows),'SHA256',digest)
          print('UNCHANGED_BUILD_SETTINGS',json.dumps(settings))
          print('HOST_TEST_ONLY_DELTA',json.dumps(sorted(changed)))
          print('HOST_TEST_COMMIT',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          print('HOST_TEST_TREE',subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip())
          PY
          shasum -a256 .github/workflows/ios-photos-host.yml
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcrun simctl list devices available
          xcodebuild -version | grep '^Xcode 27.0$'
      - name: Prepare one clean synthetic Release Photos host
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 Scripts/select_test_devices.py 'iPhone 18 Pro Max' --pre-provisioned > /tmp/host-device.txt
          id=$(cut -d' ' -f1 /tmp/host-device.txt)
          echo "$id" > /tmp/current-celluloid-simulator
          python3 Scripts/run_bounded.py --seconds 900 --label host-build xcodebuild -project Celluloid.xcodeproj -scheme CelluloidCapture -configuration Release -destination "platform=iOS Simulator,id=$id" -derivedDataPath .build-host -jobs 2 build-for-testing CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO > host-build.log 2>&1 || { tail -200 host-build.log; exit 1; }
          python3 Scripts/run_bounded.py --seconds 60 --label host-boot xcrun simctl boot "$id"
          python3 Scripts/run_bounded.py --seconds 600 --label host-bootstatus xcrun simctl bootstatus "$id" -b
          python3 Scripts/run_bounded.py --seconds 180 --label Photos-warm-up xcrun simctl launch "$id" com.apple.mobileslideshow -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN
          echo 'HOST_PHOTOS_INITIAL_LAUNCH language=zh-Hans process_reused_between_cases=true'
          python3 Scripts/create_fixture.py
          cp /tmp/celluloid-fixture.png /tmp/celluloid-fixture-a.png
          python3 Scripts/run_bounded.py --seconds 480 --label single-import-a xcrun simctl addmedia "$id" /tmp/celluloid-fixture-a.png
          sleep 3
          cp /tmp/celluloid-fixture-2.png /tmp/celluloid-fixture-b.png
          python3 Scripts/run_bounded.py --seconds 180 --label single-import-b xcrun simctl addmedia "$id" /tmp/celluloid-fixture-b.png
          shasum -a256 /tmp/celluloid-fixture-{a,b}.png
          python3 Scripts/run_bounded.py --seconds 120 --label install-host-app xcrun simctl install "$id" .build-host/Build/Products/Release-iphonesimulator/Celluloid.app
          runner=$(find .build-host/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*UITests-Runner.app')
          test -n "$runner" && test -d "$runner"
          runner_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$runner/Info.plist")
          test -n "$runner_id"
          echo "HOST_UI_RUNNER $runner_id"
          printf '%s\n' "$runner_id" > /tmp/celluloid-host-runner-id
          python3 Scripts/run_bounded.py --seconds 120 --label install-host-runner xcrun simctl install "$id" "$runner"
          for bundle in Mango.Celluloid "$runner_id"; do
            python3 Scripts/run_bounded.py --seconds 60 --label reset-synthetic-Photos xcrun simctl privacy "$id" reset photos "$bundle"
            python3 Scripts/run_bounded.py --seconds 60 --label grant-synthetic-Photos xcrun simctl privacy "$id" grant photos "$bundle"
          done
          echo 'HOST_AUTHORIZATION_SCOPE pre-granted ephemeral synthetic library; this is not user-consent coverage'
          python3 Scripts/run_bounded.py --seconds 60 --label host-light xcrun simctl ui "$id" appearance light
      - name: Verify protected no-change and editable host restoration
        timeout-minutes: 15
        run: |
          set -euo pipefail
          id=$(cat /tmp/current-celluloid-simulator)
          set +e
          TEST_RUNNER_CELLULOID_SYNTHETIC_PROBE=1 TEST_RUNNER_CELLULOID_PROBE_SOURCE_SHA="$GITHUB_SHA" TEST_RUNNER_CELLULOID_SHIPPING_SOURCE_SHA=c5875ee7586611c28879b5030e5e575a9f33fcbd python3 Scripts/run_bounded.py --seconds 900 --label actual-Photos-host xcodebuild -project Celluloid.xcodeproj -scheme CelluloidCapture -configuration Release -destination "platform=iOS Simulator,id=$id" -derivedDataPath .build-host -resultBundlePath PhotosHost.xcresult -parallel-testing-enabled NO -collect-test-diagnostics never -only-testing:CelluloidUITests/CelluloidHostAcceptanceTests/testProtectedAdjustmentDoneCancelReopen -only-testing:CelluloidUITests/CelluloidHostAcceptanceTests/testEditableSaveDisplayProcessStateAndRevert test-without-building CODE_SIGNING_ALLOWED=NO | tee photos-host.log
          result=${PIPESTATUS[0]}
          set -e
          echo "HOST_TEST_COMMAND_EXIT $result"
          xcrun xcresulttool get test-results summary --path PhotosHost.xcresult | tee /tmp/host-summary.json | tee -a "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/host-summary.json'))
          assert d['totalTestCount']==2 and d['passedTests']==2 and d['failedTests']==0,d
          PY
          test "$result" = 0
          grep '^PHOTOS_HOST_PROTECTED_NO_CHANGE_PASS' photos-host.log
          grep '^PHOTOS_HOST_EDITABLE_RESTORE_REVERT_PASS' photos-host.log
      - name: Emit exactly scoped bounded synthetic host evidence
        if: always()
        timeout-minutes: 3
        run: |
          python3 -u - <<'PY'
          import base64,hashlib,json,pathlib,subprocess
          simulator=pathlib.Path('/tmp/current-celluloid-simulator')
          runner=pathlib.Path('/tmp/celluloid-host-runner-id')
          if not simulator.exists() or not runner.exists():
              print('HOST_EVIDENCE_SETUP_ABSENT');raise SystemExit(0)
          result=subprocess.run(['xcrun','simctl','get_app_container',simulator.read_text().strip(),runner.read_text().strip(),'data'],capture_output=True,text=True,check=True,timeout=20)
          container=pathlib.Path(result.stdout.strip()).resolve()
          root=(container/'Library/Caches/CelluloidSyntheticHostEvidence').resolve()
          assert root.is_relative_to(container)
          def dimensions(data):
              assert data[:2]==b'\xff\xd8'
              offset=2
              while offset<len(data):
                  assert data[offset]==255
                  while offset<len(data) and data[offset]==255:offset+=1
                  marker=data[offset];offset+=1
                  if marker in [1,216,217] or 208<=marker<=215:continue
                  length=int.from_bytes(data[offset:offset+2],'big');assert length>=2 and offset+length<=len(data)
                  if marker in [192,193,194]:
                      return int.from_bytes(data[offset+5:offset+7],'big'),int.from_bytes(data[offset+3:offset+5],'big')
                  offset+=length
              raise AssertionError('JPEG has no supported dimension marker')
          total=0;count=0
          # Read only these two exact test-runner-owned JPEG paths and their
          # producer metadata. No broad xcresult/container export or raw upload.
          for slot in [1,2]:
              path=(root/f'host-evidence-{slot}.jpg').resolve()
              meta_path=(root/f'host-evidence-{slot}.json').resolve()
              assert path.is_relative_to(root) and meta_path.is_relative_to(root)
              if not path.exists():
                  print('HOST_EVIDENCE_SLOT_ABSENT',slot);continue
              metadata=json.loads(meta_path.read_text());data=path.read_bytes()
              assert metadata['slot']==slot and len(data)==metadata['bytes'] and len(data)<=500000
              assert metadata['name']=={1:'celluloid-host-protected-read-only',2:'celluloid-host-immediate-editable-save'}[slot]
              assert hashlib.sha256(data).hexdigest()==metadata['sha256']
              assert dimensions(data)==(metadata['width'],metadata['height'])
              total+=len(data);assert total<=1000000
              encoded=base64.b64encode(data).decode();chunks=[encoded[i:i+4096] for i in range(0,len(encoded),4096)]
              count+=1;print('HOST_EVIDENCE_BEGIN',slot)
              print('HOST_EVIDENCE_META',json.dumps({**metadata,'chunk_count':len(chunks),'encoded_characters':len(encoded)}))
              for index,chunk in enumerate(chunks):print('HOST_EVIDENCE_CHUNK',slot,index,len(chunks),chunk)
              print('HOST_EVIDENCE_END',slot,len(chunks),metadata['sha256'],flush=True)
          print('HOST_EVIDENCE_TOTAL',count,total,flush=True)
          assert count>0,'No whitelisted native host evidence was produced'
          PY
      - name: Collect bounded failure diagnostics
        if: failure()
        timeout-minutes: 3
        run: python3 Scripts/collect_simulator_diagnostics.py
      - name: Verify final source and stop owned simulator
        if: always()
        run: |
          set -euo pipefail
          if [[ -f /tmp/current-celluloid-simulator ]]; then
            python3 Scripts/run_bounded.py --seconds 60 --label host-shutdown xcrun simctl shutdown "$(cat /tmp/current-celluloid-simulator)" || true
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          echo "HOST_FINAL_TREE $(git rev-parse 'HEAD^{tree}')"
          shasum -a256 .github/workflows/ios-photos-host.yml
