name: Retain final Celluloid unsigned iOS diagnostic archive
on:
  push:
    branches: [cell-ios-archive-delivery-20261018]
permissions:
  contents: read
concurrency:
  group: cell-ios-archive-delivery-20261018
  cancel-in-progress: false
jobs:
  archive:
    if: ${{ github.ref == 'refs/heads/cell-ios-archive-delivery-20261018' && github.run_attempt == 1 }}
    name: Retain verified unsigned App Kit and Photos package
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Start the existing 1560 second archive clock
        run: |
          python3 -S - <<'PY'
          import json, os, time
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'cell-final-ios-archive-clock.json').write_text(json.dumps({
              'schema': 'Celluloid.FinalIOSArchiveClock.1', 'control_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'started_monotonic': time.monotonic(), 'started_unix': time.time(),
              'execution_budget_seconds': 1560}))
          PY
      - name: Check out exact independent control and product parent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        timeout-minutes: 2
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}
          path: control
      - name: Check out fixed final product
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        timeout-minutes: 2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: 7bd2e23afb0ad0805de6cdb8adb27b0df7153a66
          path: product
      - name: Admit source, archive once, and retain unsigned diagnostic bundle
        id: proof
        timeout-minutes: 25
        run: python3 -B -S control/Scripts/final_ios_archive.py
      - name: Admit bounded evidence upload and finalization
        id: admit-upload
        if: ${{ always() && steps.proof.outputs.evidence_ready == 'true' }}
        timeout-minutes: 1
        run: python3 -B -S control/Scripts/final_ios_archive.py admit-upload
      - name: Retain diagnostic report and verified unsigned archive
        id: upload
        if: ${{ always() && steps.admit-upload.outcome == 'success' && steps.admit-upload.outputs.upload_admitted == 'true' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cell-ios-UNSIGNED-NOT-RELEASE-QUALIFIED-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cell-final-ios-archive-evidence/report.json
            ${{ runner.temp }}/cell-final-ios-archive-evidence/source-manifest.json
            ${{ runner.temp }}/cell-final-ios-archive-evidence/Celluloid-1.1.1-3-UNSIGNED-NOT-RELEASE-QUALIFIED.xcarchive.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Verify upload and the original clock
        if: ${{ always() && steps.admit-upload.outputs.upload_admitted == 'true' }}
        timeout-minutes: 1
        env:
          CELL_ARCHIVE_UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: python3 -B -S control/Scripts/final_ios_archive.py finish-upload
