name: iOS 27 regression
on:
  push:
    branches: [codex/ios-modernization]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: celluloid-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # reviewed official v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact tested commit
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in push|workflow_dispatch) ;; *) exit 1 ;; esac
          test "$GITHUB_REPOSITORY" = 100mango/Celluloid
          test "$GITHUB_REF" = refs/heads/codex/ios-modernization
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          echo "Tested commit: $(git rev-parse HEAD)"
          echo "Tested tree: $(git rev-parse 'HEAD^{tree}')"
          shasum -a 256 .github/workflows/ios.yml
      - name: Verify stable Apple environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcrun simctl list devices available
          xcodebuild -version | grep '^Xcode 27.0$'
          xcrun simctl list runtimes | grep 'iOS 27.0'
      - name: Verify reproducible project
        run: |
          python3 Scripts/generate_project.py
          python3 Scripts/validate_release.py
          git diff --exit-code -- Celluloid.xcodeproj Celluloid.xcworkspace
      - name: Build and run regression suites on iPhone and iPad
        run: |
          set -euo pipefail
          python3 Scripts/create_fixture.py
          xcrun simctl list devicetypes
          python3 Scripts/select_test_devices.py > /tmp/test-devices.txt
          cat /tmp/test-devices.txt
          first_id=$(head -1 /tmp/test-devices.txt | cut -d' ' -f1)
          while read -r id name; do
            echo "Testing $name ($id)"
            echo "$id" > /tmp/current-celluloid-simulator
            xcodebuild -project Celluloid.xcodeproj -scheme Celluloid -configuration Debug -destination "platform=iOS Simulator,id=$id" -derivedDataPath .build build-for-testing CODE_SIGNING_ALLOWED=NO | tee "build-$id.log"
            xcrun simctl boot "$id" || true
            xcrun simctl bootstatus "$id" -b
            xcrun simctl addmedia "$id" /tmp/celluloid-fixture.png /tmp/celluloid-fixture-2.png
            xcrun simctl install "$id" .build/Build/Products/Debug-iphonesimulator/Celluloid.app
            xcrun simctl privacy "$id" grant photos Mango.Celluloid
            xcrun simctl ui "$id" appearance light
            if [[ "$id" = "$first_id" ]]; then
              for state in granted revoked limited; do
                case "$state" in
                  granted) xcrun simctl privacy "$id" grant photos Mango.Celluloid; method=testRealGrantedAccessCanSelectFixture ;;
                  revoked) xcrun simctl privacy "$id" revoke photos Mango.Celluloid; method=testRealRevokedAccessClearsSelectionAndHasRecovery ;;
                  limited) xcrun simctl privacy "$id" reset photos Mango.Celluloid; method=testRealLimitedSelectionAndManagement ;;
                esac
                echo "SYSTEM_PHOTOS_STATE $state"
                xcodebuild -project Celluloid.xcodeproj -scheme Celluloid -configuration Debug -destination "platform=iOS Simulator,id=$id" -derivedDataPath .build -resultBundlePath "TestResults-permission-$state.xcresult" -parallel-testing-enabled NO -collect-test-diagnostics never "-only-testing:CelluloidUITests/CelluloidSystemPermissionTests/$method" test-without-building CODE_SIGNING_ALLOWED=NO | tee "test-permission-$state.log"
                xcrun xcresulttool get test-results summary --path "TestResults-permission-$state.xcresult" | tee -a "$GITHUB_STEP_SUMMARY"
              done
              xcrun simctl privacy "$id" grant photos Mango.Celluloid
            fi
            xcodebuild -project Celluloid.xcodeproj -scheme Celluloid -configuration Debug -destination "platform=iOS Simulator,id=$id" -derivedDataPath .build -resultBundlePath "TestResults-$id.xcresult" -parallel-testing-enabled NO -collect-test-diagnostics never -skip-testing:CelluloidUITests/CelluloidSystemPermissionTests test-without-building CODE_SIGNING_ALLOWED=NO | tee "test-$id.log"
            xcrun xcresulttool get test-results summary --path "TestResults-$id.xcresult" | tee -a "$GITHUB_STEP_SUMMARY"
            if [[ "$id" = "$first_id" || "$name" = 'iPad Pro 13-inch (M5)' ]]; then
              xcrun simctl ui "$id" appearance dark
              echo "DARK_APPEARANCE_REGRESSION $name"
              xcodebuild -project Celluloid.xcodeproj -scheme Celluloid -configuration Debug -destination "platform=iOS Simulator,id=$id" -derivedDataPath .build -resultBundlePath "TestResults-dark-$id.xcresult" -parallel-testing-enabled NO -collect-test-diagnostics never -only-testing:CelluloidUITests/CelluloidUITests/testSeededPhotoEditingSaveAndReopen -only-testing:CelluloidUITests/CelluloidUITests/testTwoPhotoCollageZoomRotateAndSave test-without-building CODE_SIGNING_ALLOWED=NO | tee "test-dark-$id.log"
              xcrun xcresulttool get test-results summary --path "TestResults-dark-$id.xcresult" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            xcrun simctl shutdown "$id"
          done < /tmp/test-devices.txt
      - name: Collect targeted failure diagnostics
        if: failure()
        timeout-minutes: 3
        run: |
          python3 Scripts/export_permission_screenshot.py || echo 'NAMED_PERMISSION_SCREENSHOT_EXPORT_FAILED'
          python3 Scripts/collect_simulator_diagnostics.py
      - name: Build unsigned distribution archive including Photos extension
        run: |
          set -euo pipefail
          xcodebuild -project Celluloid.xcodeproj -scheme Celluloid -configuration Release -destination 'generic/platform=iOS' -archivePath .build/Celluloid.xcarchive archive CODE_SIGNING_ALLOWED=NO | tee archive.log
          python3 Scripts/archive_inventory.py .build/Celluloid.xcarchive
          git diff --exit-code HEAD --
      - name: Verify tested source stayed unchanged
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          echo "Final tested tree: $(git rev-parse 'HEAD^{tree}')"
          shasum -a 256 .github/workflows/ios.yml
