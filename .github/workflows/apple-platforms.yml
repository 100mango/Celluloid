        python3 Scripts/verify_native_icon_inputs.py
        python3 Scripts/validate_release.py
        git diff --exit-code -- Celluloid.xcodeproj Celluloid.xcworkspace
    - name: Build unsigned distribution archive including Photos extension
      run: |
        set -euo pipefail
        xcodebuild -project Celluloid.xcodeproj -scheme Celluloid -configuration Release -destination 'generic/platform=iOS' -archivePath .build/Celluloid.xcarchive -derivedDataPath .build/ArchiveDerived archive CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/archive.log"
        python3 Scripts/archive_inventory.py .build/Celluloid.xcarchive | tee "$RUNNER_TEMP/archive-inventory.log"
        # The archive also embeds Watch; compare its actual producer from this build.
        python3 Scripts/verify_embedded_watch.py .build/Celluloid.xcarchive/Products/Applications/Celluloid.app .build/ArchiveDerived --archive-producer-root --mode device --output "$RUNNER_TEMP/archive-embedded-watch.json" --build-log "$RUNNER_TEMP/archive.log"
        git diff --exit-code HEAD --
    - name: Verify tested source stayed unchanged
      if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code HEAD --
        python3 Scripts/verify_combined_source.py --phase after
        echo "Final tested tree: $(git rev-parse 'HEAD^{tree}')"
        shasum -a 256 .github/workflows/apple-platforms.yml
    - name: Export bounded combined evidence
      id: bounded_evidence
      if: always()
      run: |
        python3 Scripts/collect_native_evidence.py
    - name: Upload bounded combined evidence
      if: always() && steps.bounded_evidence.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: celluloid-archive-${{ github.sha }}
        path: ${{ runner.temp }}/celluloid-bounded-evidence/
        retention-days: 1
        if-no-files-found: error
