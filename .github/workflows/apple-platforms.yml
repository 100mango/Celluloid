name: Apple platform validation
on:
  push:
    branches: [codex/apple-platforms]
  pull_request:
    branches: [codex/ios-modernization]
permissions:
  contents: read
concurrency:
  group: celluloid-platforms-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-mac-core:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify source and stable SDKs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          sw_vers
          xcodebuild -version
          xcodebuild -version | grep -Fx 'Xcode 27.0'
          xcodebuild -showsdks
          python3 Scripts/validate_native_sources.py
      - name: Portable domain tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/CelluloidCore --scratch-path "$RUNNER_TEMP/celluloid-core" 2>&1 | tee "$RUNNER_TEMP/domain.log"
      - name: Renderer tests
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/CelluloidRendering --scratch-path "$RUNNER_TEMP/celluloid-rendering" 2>&1 | tee "$RUNNER_TEMP/rendering.log"
      - name: Native Mac document tests
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project CelluloidNative.xcodeproj -scheme CelluloidMac -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/celluloid-native" -resultBundlePath "$RUNNER_TEMP/CelluloidMac.xcresult" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/mac.log"
      - name: Native Mac UI launch and editing
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project CelluloidNative.xcodeproj -scheme CelluloidMacUI -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/celluloid-native" -resultBundlePath "$RUNNER_TEMP/CelluloidMacUI.xcresult" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/mac-ui.log"
      - name: Preserve native validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: celluloid-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/domain.log
            ${{ runner.temp }}/rendering.log
            ${{ runner.temp }}/mac.log
            ${{ runner.temp }}/mac-ui.log
            ${{ runner.temp }}/CelluloidMac.xcresult
            ${{ runner.temp }}/CelluloidMacUI.xcresult
          retention-days: 14
      - name: Verify unchanged source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
