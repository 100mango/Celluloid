        run: |
          python3 Scripts/collect_native_evidence.py
      - name: Upload bounded synthetic evidence
        if: always() && steps.bounded_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: celluloid-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/celluloid-bounded-evidence/
          retention-days: 1
          if-no-files-found: error
  uikit-regression:
    needs: [build-preflight, native-mac, native-simulator]
    if: always() && needs.build-preflight.result == 'success' && needs.native-mac.outputs.continuation_safe == 'true'
    name: iOS27 regression (${{ matrix.key }})
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
        - key: compact-phone
          device: iPhone SE (3rd generation)
        - key: large-phone
          device: iPhone 18 Pro Max
        - key: small-ipad
          device: iPad mini (A17 Pro)
        - key: large-ipad
          device: iPad Pro 13-inch (M5)
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      DEVICE_NAME: ${{ matrix.device }}
      CELLULOID_EVIDENCE_PLATFORM: ${{ matrix.key }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Verify exact tested commit
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      shell: bash
      run: |
        set -euo pipefail
        case "$GITHUB_EVENT_NAME" in push|workflow_dispatch) ;; *) exit 1 ;; esac
        test "$GITHUB_REPOSITORY" = 100mango/Celluloid
        test "$GITHUB_REF" = refs/heads/apple-platforms
        test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code HEAD --
        python3 Scripts/verify_combined_source.py --phase before
        echo "Tested commit: $(git rev-parse HEAD)"
        echo "Tested tree: $(git rev-parse 'HEAD^{tree}')"
        shasum -a 256 .github/workflows/apple-platforms.yml
    - name: Verify reviewed combined application tests and build settings
      run: |
        python3 Scripts/verify_combined_source.py --phase before
    - name: Verify stable Apple environment
      run: |
        set -euo pipefail
        sw_vers
        xcodebuild -version
        xcodebuild -showsdks
        xcrun simctl list runtimes
        xcrun simctl list devices available
        xcodebuild -version | grep '^Xcode 27.0$'
        xcrun simctl list runtimes | grep 'iOS 27.0'
    - name: Verify reproducible project
      run: |
        python3 Scripts/generate_native_project.py
        python3 Scripts/generate_project.py
        swift -swift-version 5 Scripts/materialize_native_icons.swift
        python3 Scripts/verify_native_icon_inputs.py
        python3 Scripts/validate_release.py
        git diff --exit-code -- Celluloid.xcodeproj Celluloid.xcworkspace
    - name: Compile Release app framework and Photos extension
      if: ${{ matrix.key == 'compact-phone' }}
      timeout-minutes: 12
      run: |
        set -euo pipefail
        python3 Scripts/run_bounded.py --seconds 600 --label Release-shipping-compile xcodebuild -project Celluloid.xcodeproj -scheme Celluloid -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/Release -jobs 2 build CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO | tee "$RUNNER_TEMP/release-build.log"
    - name: Retrieve exact-head manufactured Mac layer fixture
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: celluloid-mac-${{ github.sha }}
        path: ${{ runner.temp }}/mac-fixture-evidence/
    - name: Verify every device selection branch on runner Bash
      run: |
        /bin/bash Scripts/test_matrix_device_selection.sh
    - name: Select build and boot isolated test simulator
      id: prepare
      run: |
        set -euo pipefail
        python3 Scripts/create_fixture.py
        /bin/bash Scripts/select_matrix_device.sh "$DEVICE_NAME" > /tmp/test-devices.txt
        cat /tmp/test-devices.txt
        test "$(wc -l < /tmp/test-devices.txt | tr -d ' ')" = 1
        id=$(cut -d' ' -f1 /tmp/test-devices.txt)
        echo "$id" > /tmp/current-celluloid-simulator
        sysctl hw.memsize hw.ncpu
        df -h "$HOME" .build 2>/dev/null || df -h "$HOME"
        python3 Scripts/run_bounded.py --seconds 900 --label "$DEVICE_NAME build" xcodebuild -project Celluloid.xcodeproj -scheme Celluloid -configuration Debug -destination "platform=iOS Simulator,id=$id" -derivedDataPath .build -jobs 2 build-for-testing CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO | tee "$RUNNER_TEMP/build.log"
        python3 Scripts/run_bounded.py --seconds 20 --label pre-boot-memory memory_pressure -Q
        python3 Scripts/run_bounded.py --seconds 20 --label pre-boot-vm vm_stat
        python3 Scripts/run_bounded.py --seconds 20 --label pre-boot-swap sysctl vm.swapusage
        python3 Scripts/run_bounded.py --seconds 60 --label "$DEVICE_NAME boot" xcrun simctl boot "$id"
        python3 Scripts/run_bounded.py --seconds 600 --label "$DEVICE_NAME bootstatus" xcrun simctl bootstatus "$id" -b
        # File-only staging never launches the app or touches Photos.
        python3 Scripts/stage_uikit_layer_fixture.py "$id" .build/Build/Products/Debug-iphonesimulator/Celluloid.app "$RUNNER_TEMP/mac-fixture-evidence" --output "$RUNNER_TEMP/uikit-layer-staging.json"
    - name: Run pure unit and decorated export regressions before import
      id: units
      timeout-minutes: 17
      if: ${{ !cancelled() && steps.prepare.conclusion == 'success' }}
      run: |
        set -euo pipefail
        id=$(cat /tmp/current-celluloid-simulator)
        python3 Scripts/run_bounded.py --seconds 900 --label "$DEVICE_NAME units" xcodebuild -project Celluloid.xcodeproj -scheme Celluloid -configuration Debug -destination "platform=iOS Simulator,id=$id" -derivedDataPath .build -resultBundlePath TestResults-units.xcresult -parallel-testing-enabled NO -collect-test-diagnostics never -only-testing:CelluloidTests -skip-testing:CelluloidTests/AdjustmentPreservationPhotoKitTests -skip-testing:CelluloidTests/AdaptiveInterfaceTests/testFullLocalizedTitlesFitAtNormalAndLargestTextAcrossViewports -skip-testing:CelluloidTests/CollageCompositionTests -skip-testing:CelluloidTests/OverlayResizeTests/testPhotosExtensionRestartWithoutAdjustmentClearsDecorationsFilterAndCancellation -skip-testing:CelluloidTests/EditorRegressionTests/testExtensionStartsRendersAndFinishesSeededPhotoWithoutLibraryMutation -skip-testing:CelluloidTests/EditorRegressionTests/testPhotosLibraryBootstrapReadiness -skip-testing:CelluloidTests/EditorRegressionTests/testReconcileSyntheticPhotosAfterImport test-without-building CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/units.log"
        xcrun xcresulttool get test-results summary --path TestResults-units.xcresult | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Require actual original UIKit manufactured-layer consumer
      if: ${{ !cancelled() && steps.prepare.conclusion == 'success' }}
      run: |
        python3 Scripts/verify_required_interoperability.py uikit --platform-contract --result-bundle TestResults-units.xcresult --device-id-file /tmp/current-celluloid-simulator --expected-model "$DEVICE_NAME" --log "$RUNNER_TEMP/units.log" --fixtures "$RUNNER_TEMP/mac-fixture-evidence" --output "$RUNNER_TEMP/uikit-required-tests.json"
    - name: Verify PhotoKit readiness and reconcile pristine fixtures
      id: photos
      if: ${{ !cancelled() && steps.prepare.conclusion == 'success' }}
      run: |
        set -euo pipefail
        id=$(cat /tmp/current-celluloid-simulator)
        python3 Scripts/run_bounded.py --seconds 45 --label "$DEVICE_NAME registration" xcrun simctl get_app_container "$id" Mango.Celluloid app
        python3 Scripts/run_bounded.py --seconds 60 --label "$DEVICE_NAME initial-grant" xcrun simctl privacy "$id" grant photos Mango.Celluloid
        python3 Scripts/run_bounded.py --seconds 60 --label "$DEVICE_NAME initial-light" xcrun simctl ui "$id" appearance light
        python3 -u Scripts/probe_photos_bootstrap.py "$id" --already-prepared
    - name: Run pristine Photos integration regressions
      if: ${{ !cancelled() && steps.prepare.conclusion == 'success' }}
      run: |
        set -euo pipefail
        test -f /tmp/celluloid-bootstrap-assets-verified
        id=$(cat /tmp/current-celluloid-simulator)
        python3 Scripts/run_bounded.py --seconds 900 --label "$DEVICE_NAME Photos-integration" xcodebuild -project Celluloid.xcodeproj -scheme Celluloid -configuration Debug -destination "platform=iOS Simulator,id=$id" -derivedDataPath .build -resultBundlePath TestResults-Photos-integration.xcresult -parallel-testing-enabled NO -collect-test-diagnostics never -only-testing:CelluloidTests/AdaptiveInterfaceTests/testFullLocalizedTitlesFitAtNormalAndLargestTextAcrossViewports -only-testing:CelluloidTests/CollageCompositionTests -only-testing:CelluloidTests/OverlayResizeTests/testPhotosExtensionRestartWithoutAdjustmentClearsDecorationsFilterAndCancellation -only-testing:CelluloidTests/EditorRegressionTests/testExtensionStartsRendersAndFinishesSeededPhotoWithoutLibraryMutation test-without-building CODE_SIGNING_ALLOWED=NO
        xcrun xcresulttool get test-results summary --path TestResults-Photos-integration.xcresult | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Run real Photos permission transitions
      if: ${{ !cancelled() && steps.prepare.conclusion == 'success' && matrix.key == 'compact-phone' }}
      run: |
        set -euo pipefail
        # Continue independently after reconciled setup errors, but the job stays red.
        test -f /tmp/celluloid-bootstrap-assets-verified
        id=$(cat /tmp/current-celluloid-simulator)
        failures=0
        for state in granted revoked limited; do
          case "$state" in
            granted) action=grant; method=testRealGrantedAccessCanSelectFixture ;;
            revoked) action=revoke; method=testRealRevokedAccessClearsSelectionAndHasRecovery ;;
            limited) action=reset; method=testRealLimitedSelectionAndManagement ;;
          esac
          python3 Scripts/run_bounded.py --seconds 60 --label "$DEVICE_NAME $state" xcrun simctl privacy "$id" "$action" photos Mango.Celluloid || { failures=$((failures + 1)); continue; }
          if ! python3 Scripts/run_bounded.py --seconds 360 --label "$DEVICE_NAME permission-$state" xcodebuild -project Celluloid.xcodeproj -scheme Celluloid -configuration Debug -destination "platform=iOS Simulator,id=$id" -derivedDataPath .build -resultBundlePath "TestResults-permission-$state.xcresult" -parallel-testing-enabled NO -collect-test-diagnostics never "-only-testing:CelluloidUITests/CelluloidSystemPermissionTests/$method" test-without-building CODE_SIGNING_ALLOWED=NO; then failures=$((failures + 1)); fi
          xcrun xcresulttool get test-results summary --path "TestResults-permission-$state.xcresult" | tee -a "$GITHUB_STEP_SUMMARY" || failures=$((failures + 1))
        done
        python3 Scripts/run_bounded.py --seconds 60 --label "$DEVICE_NAME restore-grant" xcrun simctl privacy "$id" grant photos Mango.Celluloid || failures=$((failures + 1))
        test "$failures" -eq 0
    - name: Run strict landscape preflight
      id: preflight
      if: ${{ !cancelled() && steps.prepare.conclusion == 'success' && matrix.key == 'large-phone' }}
      run: |
        set -euo pipefail
        # Continue independently after reconciled setup errors, but the job stays red.
        test -f /tmp/celluloid-bootstrap-assets-verified
        id=$(cat /tmp/current-celluloid-simulator)
        python3 Scripts/run_bounded.py --seconds 900 --label "$DEVICE_NAME preflight" xcodebuild -project Celluloid.xcodeproj -scheme Celluloid -configuration Debug -destination "platform=iOS Simulator,id=$id" -derivedDataPath .build -resultBundlePath TestResults-preflight.xcresult -parallel-testing-enabled NO -collect-test-diagnostics never -only-testing:CelluloidUITests/CelluloidUITests/testLimitedEmptyPhotosHasManagementAndAdaptiveLayout -only-testing:CelluloidUITests/CelluloidUITests/testSeededPhotoEditingSaveAndReopen test-without-building CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/preflight.log"
        xcrun xcresulttool get test-results summary --path TestResults-preflight.xcresult | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Run core and official accessibility UI regressions
      if: ${{ !cancelled() && steps.prepare.conclusion == 'success' && (matrix.key != 'large-phone' || steps.preflight.conclusion == 'success') }}
      run: |
        set -euo pipefail
        # Continue independently after reconciled setup errors, but the job stays red.
        test -f /tmp/celluloid-bootstrap-assets-verified
        id=$(cat /tmp/current-celluloid-simulator)
        python3 Scripts/run_bounded.py --seconds 900 --label "$DEVICE_NAME ui" xcodebuild -project Celluloid.xcodeproj -scheme Celluloid -configuration Debug -destination "platform=iOS Simulator,id=$id" -derivedDataPath .build -resultBundlePath TestResults-ui.xcresult -parallel-testing-enabled NO -collect-test-diagnostics never -only-testing:CelluloidUITests/CelluloidUITests test-without-building CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/ui.log"
        xcrun xcresulttool get test-results summary --path TestResults-ui.xcresult | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Run Dark Mode editing and collage regressions
      if: ${{ !cancelled() && steps.prepare.conclusion == 'success' && (matrix.key == 'compact-phone' || matrix.key == 'large-ipad') }}
      run: |
        set -euo pipefail
        # Continue independently after reconciled setup errors, but the job stays red.
        test -f /tmp/celluloid-bootstrap-assets-verified
        id=$(cat /tmp/current-celluloid-simulator)
        python3 Scripts/run_bounded.py --seconds 60 --label "$DEVICE_NAME dark-appearance" xcrun simctl ui "$id" appearance dark
        python3 Scripts/run_bounded.py --seconds 900 --label "$DEVICE_NAME dark" xcodebuild -project Celluloid.xcodeproj -scheme Celluloid -configuration Debug -destination "platform=iOS Simulator,id=$id" -derivedDataPath .build -resultBundlePath TestResults-dark.xcresult -parallel-testing-enabled NO -collect-test-diagnostics never -only-testing:CelluloidUITests/CelluloidUITests/testSeededPhotoEditingSaveAndReopen -only-testing:CelluloidUITests/CelluloidUITests/testTwoPhotoCollageZoomRotateAndSave test-without-building CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/dark.log"
        xcrun xcresulttool get test-results summary --path TestResults-dark.xcresult | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Verify actual PhotoKit opaque preservation and output destinations
      if: ${{ success() && matrix.key == 'compact-phone' }}
      timeout-minutes: 12
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code HEAD --
        test -f /tmp/celluloid-bootstrap-assets-verified
        id=$(cat /tmp/current-celluloid-simulator)
        # Apple's TEST_RUNNER_ prefix forwards only these two explicit public
        # prerequisites to this one XCTest invocation, without editing the scheme
        # or enabling the mutation probe for pre-import units/other devices.
        # https://developer.apple.com/documentation/xcode/environment-variable-reference
        TEST_RUNNER_CELLULOID_SYNTHETIC_PROBE=1 TEST_RUNNER_CELLULOID_PROBE_SOURCE_SHA="$GITHUB_SHA" \
          python3 Scripts/run_bounded.py --seconds 600 --label actual-PhotoKit-preservation xcodebuild -project Celluloid.xcodeproj -scheme Celluloid -configuration Debug -destination "platform=iOS Simulator,id=$id" -derivedDataPath .build -resultBundlePath TestResults-preservation.xcresult -parallel-testing-enabled NO -collect-test-diagnostics never -only-testing:CelluloidTests/AdjustmentPreservationPhotoKitTests test-without-building CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/preservation.log"
        xcrun xcresulttool get test-results summary --path TestResults-preservation.xcresult | tee /tmp/preservation-summary.json | tee -a "$GITHUB_STEP_SUMMARY"
        python3 - <<'PYRESULT'
        import json
        result=json.load(open('/tmp/preservation-summary.json'))
        assert result['totalTestCount']==3 and result['passedTests']==3 and result['failedTests']==0,result
        PYRESULT
    - name: Export bounded synthetic UI evidence
      if: always()
      timeout-minutes: 3
      run: |
        set -euo pipefail
        python3 -u Scripts/export_permission_screenshot.py | tee "$RUNNER_TEMP/uikit-screens.log"
    - name: Collect targeted failure diagnostics
      if: failure()
      timeout-minutes: 3
      run: |
        set -euo pipefail
        python3 Scripts/collect_simulator_diagnostics.py | tee "$RUNNER_TEMP/uikit-diagnostics.log"
    - name: Stop owned simulator
      if: always()
      run: |
        if [[ -f /tmp/current-celluloid-simulator ]]; then
          id=$(cat /tmp/current-celluloid-simulator)
          python3 Scripts/run_bounded.py --seconds 60 --label "$DEVICE_NAME shutdown" xcrun simctl shutdown "$id" || true
        fi
    - name: Verify tested source stayed unchanged
      if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code HEAD --
        python3 Scripts/verify_combined_source.py --phase after
        echo "Final tested tree: $(git rev-parse 'HEAD^{tree}')"
        shasum -a 256 .github/workflows/apple-platforms.yml
    - name: Export bounded combined evidence
      id: bounded_evidence
      if: always()
      run: |
        python3 Scripts/collect_native_evidence.py
    - name: Upload bounded combined evidence
      if: always() && steps.bounded_evidence.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: celluloid-uikit-${{ matrix.key }}-${{ github.sha }}
        path: ${{ runner.temp }}/celluloid-bounded-evidence/
        retention-days: 1
        if-no-files-found: error
  archive:
