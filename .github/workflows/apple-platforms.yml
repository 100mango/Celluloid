name: Combined Apple platform validation
on:
  push:
    branches: [apple-platforms]
permissions:
  contents: read
concurrency:
  group: celluloid-platforms-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-preflight:
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      CELLULOID_EVIDENCE_PLATFORM: preflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact combined source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/verify_combined_source.py --phase before
          sw_vers
          xcodebuild -version
          xcodebuild -version | grep -Fx 'Xcode 27.0'
          xcodebuild -showsdks
          # Fail setup regressions before expensive Apple runtime fan-out. The
          # evidence tests explicitly exercise each inherited platform budget.
          python3 -m unittest discover -s Scripts -p 'test_*.py' -v
          swift -swift-version 5 Scripts/materialize_native_icons.swift
          python3 Scripts/verify_native_icon_inputs.py
      - name: Grouped all-platform build testing setup and package prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/run_combined_preflight.py 2>&1 | tee "$RUNNER_TEMP/preflight.log"
      - name: Verify unchanged combined source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/verify_combined_source.py --phase after
          python3 Scripts/verify_native_icon_inputs.py
      - name: Export bounded prerequisite evidence
        id: bounded_evidence
        if: always()
        shell: bash
        run: |
          python3 Scripts/collect_native_evidence.py
      - name: Upload bounded prerequisite evidence
        if: always() && steps.bounded_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: celluloid-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/celluloid-bounded-evidence/
          retention-days: 1
          if-no-files-found: error
  native-mac:
    outputs:
      continuation_safe: ${{ steps.early_interop.outputs.continuation_safe }}
    needs: build-preflight
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      CELLULOID_EVIDENCE_PLATFORM: mac
    steps:
      - name: Reserve Mac job collection time
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          # Four minutes remain outside this conservative first-step clock for
          # runner/action setup; final proof/upload gets a separate five minutes.
          Path(os.environ['RUNNER_TEMP'],'mac-job-clock.json').write_text(json.dumps({
            'source_sha':os.environ['GITHUB_SHA'], 'started_monotonic':time.monotonic(),
            'started_unix':time.time(), 'execution_budget_seconds':41*60}))
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify source and stable SDKs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          sw_vers
          xcodebuild -version
          xcodebuild -version | grep -Fx 'Xcode 27.0'
          xcodebuild -showsdks
          python3 Scripts/verify_combined_source.py --phase before
          python3 Scripts/validate_native_sources.py
          python3 Scripts/test_native_evidence.py
          python3 Scripts/test_native_fixture_handoff.py
          python3 Scripts/test_native_process.py
          python3 Scripts/test_native_workflow_syntax.py
          python3 Scripts/test_native_watch_profiles.py
          python3 Scripts/test_native_phone_fixture.py
          python3 Scripts/test_phone_harness_release.py
          python3 Scripts/test_native_release.py
          python3 -m unittest discover -s Scripts -p 'test_embedded_watch.py' -v
          python3 -m unittest discover -s Scripts -p 'test_layer_fixture_handoff.py' -v
          python3 Scripts/test_mac_photos_extension.py
          python3 Scripts/test_combined_validation.py
          swift -swift-version 5 Scripts/materialize_native_icons.swift
          python3 Scripts/verify_native_icon_inputs.py
          python3 Scripts/validate_native_localization.py
      - name: Portable domain tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/CelluloidCore --scratch-path "$RUNNER_TEMP/celluloid-core" 2>&1 | tee "$RUNNER_TEMP/domain.log"
      - name: Renderer tests
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/CelluloidRendering --scratch-path "$RUNNER_TEMP/celluloid-rendering" 2>&1 | tee "$RUNNER_TEMP/rendering.log"
      - name: Native Mac document tests
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project CelluloidNative.xcodeproj -scheme CelluloidMac -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/celluloid-native" -resultBundlePath "$RUNNER_TEMP/CelluloidMac.xcresult" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/mac.log"
      - name: Require all Mac extension cases and exact manufactured fixtures
        id: mac_producer
        if: success() || failure()
        shell: bash
        run: |
          python3 Scripts/verify_required_interoperability.py mac --platform-contract --log "$RUNNER_TEMP/mac.log" --output "$RUNNER_TEMP/mac-required-tests.json"
      - name: Qualify native text and frozen per-runtime UIKit controls
        id: early_interop
        if: (success() || failure()) && steps.mac_producer.outcome == 'success'
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python3 Scripts/run_early_uikit_interop.py || status=$?
          python3 Scripts/verify_interop_continuation.py --github-output "$GITHUB_OUTPUT"
          # Preserve the actual strict-pixel failure after independent proof.
          exit "$status"
      - name: Native Mac UI launch and editing
        if: (success() || failure()) && steps.early_interop.outputs.continuation_safe == 'true'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project CelluloidNative.xcodeproj -scheme CelluloidMacUI -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/celluloid-native" -resultBundlePath "$RUNNER_TEMP/CelluloidMacUI.xcresult" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/mac-ui.log"
      - name: Build and verify minimally entitled sandbox app
        id: sandbox_build
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project CelluloidNative.xcodeproj -scheme CelluloidMacUI -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/celluloid-sandbox" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual CELLULOID_EXPECT_SANDBOX=YES build-for-testing 2>&1 | tee "$RUNNER_TEMP/sandbox-build.log"
          # The test build instruments its target with broad temporary exceptions.
          # Rebuild the app for ordinary execution, while keeping the external UI bundle.
          xcodebuild -project CelluloidNative.xcodeproj -scheme CelluloidMac -configuration Debug -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/celluloid-sandbox" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual ENABLE_TESTABILITY=NO build 2>&1 | tee "$RUNNER_TEMP/sandbox-app-build.log"
          APP="$RUNNER_TEMP/celluloid-sandbox/Build/Products/Debug/CelluloidMac.app"
          codesign --verify --strict --deep "$APP"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/sandbox-entitlements.plist"
          python3 -c 'import plistlib,sys; p=plistlib.load(open(sys.argv[1],"rb")); assert p == {"com.apple.security.app-sandbox":True,"com.apple.security.files.user-selected.read-write":True}' "$RUNNER_TEMP/sandbox-entitlements.plist"
          # XCUI's injected debugging support needs this ephemeral Debug permission.
          # The Release/source contract above stays exactly the two app permissions.
          python3 -c 'import plistlib,sys; p=plistlib.load(open(sys.argv[1],"rb")); p["com.apple.security.get-task-allow"]=True; plistlib.dump(p,open(sys.argv[2],"wb"))' "$RUNNER_TEMP/sandbox-entitlements.plist" "$RUNNER_TEMP/sandbox-debug-entitlements.plist"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/sandbox-debug-entitlements.plist" --timestamp=none "$APP"
          codesign --verify --strict --deep "$APP"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/sandbox-debug-actual.plist"
          python3 -c 'import plistlib,sys; assert plistlib.load(open(sys.argv[1],"rb")) == plistlib.load(open(sys.argv[2],"rb"))' "$RUNNER_TEMP/sandbox-debug-entitlements.plist" "$RUNNER_TEMP/sandbox-debug-actual.plist"
      - name: Verify actual embedded sandbox extension before UI
        id: sandbox_child
        if: (success() || failure()) && steps.sandbox_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          CHILD="$RUNNER_TEMP/celluloid-sandbox/Build/Products/Debug/CelluloidMac.app/Contents/PlugIns/CelluloidMacPhotosExtension.appex"
          codesign --verify --strict --deep "$CHILD"
          codesign -d --entitlements :- "$CHILD" > "$RUNNER_TEMP/sandbox-extension-entitlements-before.plist"
          python3 -c 'import plistlib,sys; assert plistlib.load(open(sys.argv[1],"rb")) == {"com.apple.security.app-sandbox":True}' "$RUNNER_TEMP/sandbox-extension-entitlements-before.plist"
      - name: External sandbox document UI and container runtime
        if: (success() || failure()) && steps.early_interop.outputs.continuation_safe == 'true' && steps.sandbox_build.outcome == 'success' && steps.sandbox_child.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          # Only the UI bundle runs externally. No hosted unit bundle is injected.
          status=0
          TEST_RUNNER_CELLULOID_HOST_SEED_SOURCE_SHA="$GITHUB_SHA" xcodebuild -project CelluloidNative.xcodeproj -scheme CelluloidMacUI -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/celluloid-sandbox" -resultBundlePath "$RUNNER_TEMP/CelluloidSandbox.xcresult" CODE_SIGNING_ALLOWED=NO CELLULOID_EXPECT_SANDBOX=YES test-without-building 2>&1 | tee "$RUNNER_TEMP/sandbox.log" || status=$?
          APP="$RUNNER_TEMP/celluloid-sandbox/Build/Products/Debug/CelluloidMac.app"
          codesign --verify --strict --deep "$APP"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/sandbox-entitlements-after.plist"
          cmp "$RUNNER_TEMP/sandbox-debug-actual.plist" "$RUNNER_TEMP/sandbox-entitlements-after.plist"
          exit "$status"
      - name: Verify actual embedded sandbox extension after UI
        if: (success() || failure()) && steps.sandbox_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          CHILD="$RUNNER_TEMP/celluloid-sandbox/Build/Products/Debug/CelluloidMac.app/Contents/PlugIns/CelluloidMacPhotosExtension.appex"
          codesign --verify --strict --deep "$CHILD"
          codesign -d --entitlements :- "$CHILD" > "$RUNNER_TEMP/sandbox-extension-entitlements.plist"
          python3 -c 'import plistlib,sys; assert plistlib.load(open(sys.argv[1],"rb")) == {"com.apple.security.app-sandbox":True}' "$RUNNER_TEMP/sandbox-extension-entitlements.plist"
          cmp "$RUNNER_TEMP/sandbox-extension-entitlements-before.plist" "$RUNNER_TEMP/sandbox-extension-entitlements.plist"
      - name: Isolated native Mac Photos extension build
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project CelluloidNative.xcodeproj -scheme CelluloidMacPhotosExtension -configuration Release -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/celluloid-mac-photos" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/mac-photos-build.log"
      - name: Unsigned native Mac Release packaging
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project CelluloidNative.xcodeproj -scheme CelluloidMac -configuration Release -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/celluloid-release" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/mac-release.log"
          python3 Scripts/verify_native_release.py mac "$RUNNER_TEMP/celluloid-release/Build/Products/Release/CelluloidMac.app"
      - name: Verify unchanged combined source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/verify_combined_source.py --phase after
          python3 Scripts/verify_native_icon_inputs.py
      - name: Export bounded synthetic evidence
        id: bounded_evidence
        if: always()
        shell: bash
        run: |
          python3 Scripts/collect_native_evidence.py
      - name: Upload bounded synthetic evidence
        if: always() && steps.bounded_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: celluloid-mac-${{ github.sha }}
          path: ${{ runner.temp }}/celluloid-bounded-evidence/
          retention-days: 1
          if-no-files-found: error
  native-mac-host:
    # A new ephemeral VM, serialized behind Mac diagnostics. Host registration is
    # independent of cross-display pixels; neither result grants release acceptance.
    needs: [build-preflight, native-mac]
    if: always() && needs.build-preflight.result == 'success'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      CELLULOID_EVIDENCE_PLATFORM: mac-host
    steps:
      - name: Reserve Mac job collection time
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          # Four minutes remain outside this conservative first-step clock for
          # runner/action setup; final proof/upload gets a separate five minutes.
          Path(os.environ['RUNNER_TEMP'],'mac-job-clock.json').write_text(json.dumps({
            'source_sha':os.environ['GITHUB_SHA'], 'started_monotonic':time.monotonic(),
            'started_unix':time.time(), 'execution_budget_seconds':41*60}))
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Fetch and verify immutable Photos host source base
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess, sys
          sys.path.insert(0, 'Scripts')
          from native_process import run
          base='9c9e7fc9c12df342c883e8a1e4462f796469842c'
          tree='f53aa262fb56d31cd0b2f03f3836147c26ff2858'
          run(['git','fetch','--no-tags','--depth=1','origin',base],timeout=60)
          assert subprocess.check_output(['git','rev-parse',base+'^{commit}'],text=True,timeout=10).strip()==base
          assert subprocess.check_output(['git','rev-parse',base+'^{tree}'],text=True,timeout=10).strip()==tree
          PY
      - name: Verify exact host source and stable SDK before building
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          sw_vers
          xcodebuild -version | grep -Fx 'Xcode 27.0'
          python3 Scripts/verify_combined_source.py --phase before
          python3 Scripts/mac_photos_host_gate.py source-before
          swift -swift-version 5 Scripts/materialize_native_icons.swift
          python3 Scripts/verify_native_icon_inputs.py
      - name: Build and verify minimally entitled sandbox app
        id: sandbox_build
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/run_bounded.py --seconds 600 --label fresh-host-ui-build xcodebuild -project CelluloidNative.xcodeproj -scheme CelluloidMacUI -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/celluloid-sandbox" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual CELLULOID_EXPECT_SANDBOX=YES build-for-testing 2>&1 | tee "$RUNNER_TEMP/sandbox-build.log"
          # The test build instruments its target with broad temporary exceptions.
          # Rebuild the app for ordinary execution, while keeping the external UI bundle.
          python3 Scripts/run_bounded.py --seconds 300 --label fresh-host-app-build xcodebuild -project CelluloidNative.xcodeproj -scheme CelluloidMac -configuration Debug -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/celluloid-sandbox" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual ENABLE_TESTABILITY=NO build 2>&1 | tee "$RUNNER_TEMP/sandbox-app-build.log"
          APP="$RUNNER_TEMP/celluloid-sandbox/Build/Products/Debug/CelluloidMac.app"
          codesign --verify --strict --deep "$APP"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/sandbox-entitlements.plist"
          python3 -c 'import plistlib,sys; p=plistlib.load(open(sys.argv[1],"rb")); assert p == {"com.apple.security.app-sandbox":True,"com.apple.security.files.user-selected.read-write":True}' "$RUNNER_TEMP/sandbox-entitlements.plist"
          # XCUI's injected debugging support needs this ephemeral Debug permission.
          # The Release/source contract above stays exactly the two app permissions.
          python3 -c 'import plistlib,sys; p=plistlib.load(open(sys.argv[1],"rb")); p["com.apple.security.get-task-allow"]=True; plistlib.dump(p,open(sys.argv[2],"wb"))' "$RUNNER_TEMP/sandbox-entitlements.plist" "$RUNNER_TEMP/sandbox-debug-entitlements.plist"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/sandbox-debug-entitlements.plist" --timestamp=none "$APP"
          codesign --verify --strict --deep "$APP"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/sandbox-debug-actual.plist"
          python3 -c 'import plistlib,sys; assert plistlib.load(open(sys.argv[1],"rb")) == plistlib.load(open(sys.argv[2],"rb"))' "$RUNNER_TEMP/sandbox-debug-entitlements.plist" "$RUNNER_TEMP/sandbox-debug-actual.plist"
      - name: Verify actual embedded sandbox extension before UI
        id: sandbox_child
        if: (success() || failure()) && steps.sandbox_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          CHILD="$RUNNER_TEMP/celluloid-sandbox/Build/Products/Debug/CelluloidMac.app/Contents/PlugIns/CelluloidMacPhotosExtension.appex"
          codesign --verify --strict --deep "$CHILD"
          codesign -d --entitlements :- "$CHILD" > "$RUNNER_TEMP/sandbox-extension-entitlements-before.plist"
          python3 -c 'import plistlib,sys; assert plistlib.load(open(sys.argv[1],"rb")) == {"com.apple.security.app-sandbox":True}' "$RUNNER_TEMP/sandbox-extension-entitlements-before.plist"
      - name: Prepare verified Photos host context
        id: host_context
        if: (success() || failure()) && steps.sandbox_child.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/mac_photos_host_gate.py budget-before-prepare
          python3 Scripts/mac_photos_host_gate.py source-before
          python3 Scripts/mac_photos_host_gate.py prepare
          python3 Scripts/mac_owned_crash.py optional-prepare || true
      - name: Actual Photos host discovery using the qualified sandbox product
        id: mac_host
        if: (success() || failure()) && steps.sandbox_child.outcome == 'success' && steps.host_context.outcome == 'success'
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/test_mac_photos_host_gate.py
          /bin/bash Scripts/run_mac_photos_host_gate.sh
      - name: Verify unchanged rebuilt host source and icon inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/verify_combined_source.py --phase after
          python3 Scripts/verify_native_icon_inputs.py
      - name: Require exact executed case and same-candidate host receipts
        if: always() && steps.sandbox_child.outcome == 'success'
        shell: bash
        run: |
          python3 Scripts/mac_photos_host_gate.py accept
      - name: Bound and replay the dedicated host proof
        id: bounded_host_evidence
        if: always() && steps.sandbox_child.outcome == 'success'
        shell: bash
        run: |
          python3 Scripts/mac_owned_crash.py optional-capture || true
          python3 Scripts/mac_photos_host_gate.py collect
      - name: Upload bounded actual Photos host evidence
        if: always() && steps.bounded_host_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: celluloid-mac-host-${{ github.sha }}
          path: ${{ runner.temp }}/mac-host-evidence/
          retention-days: 1
          if-no-files-found: error
  native-simulator:
    needs: [build-preflight, native-mac, native-mac-host]
    if: always() && needs.build-preflight.result == 'success' && needs.native-mac.outputs.continuation_safe == 'true'
    runs-on: xcode-27
    timeout-minutes: ${{ matrix.platform == 'watch' && 45 || 30 }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [tv, watch, phone, vision]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      CELLULOID_EVIDENCE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify source and stable SDKs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          sw_vers
          xcodebuild -version
          xcodebuild -version | grep -Fx 'Xcode 27.0'
          xcodebuild -showsdks
          python3 Scripts/verify_combined_source.py --phase before
          python3 Scripts/validate_native_sources.py
          python3 Scripts/test_native_evidence.py
          python3 Scripts/test_native_fixture_handoff.py
          python3 Scripts/test_native_process.py
          python3 Scripts/test_native_workflow_syntax.py
          python3 Scripts/test_native_watch_profiles.py
          python3 Scripts/test_native_phone_fixture.py
          python3 Scripts/test_phone_harness_release.py
          python3 Scripts/test_native_release.py
          python3 -m unittest discover -s Scripts -p 'test_embedded_watch.py' -v
          python3 -m unittest discover -s Scripts -p 'test_layer_fixture_handoff.py' -v
          python3 Scripts/test_mac_photos_extension.py
          python3 Scripts/test_combined_validation.py
          swift -swift-version 5 Scripts/materialize_native_icons.swift
          python3 Scripts/verify_native_icon_inputs.py
          python3 Scripts/validate_native_localization.py
      - name: Retrieve exact-head Mac-authored synthetic archive fixtures
        if: matrix.platform == 'phone'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: celluloid-mac-${{ github.sha }}
          path: ${{ runner.temp }}/mac-fixture-evidence/
      - name: Native TV build
        id: tv_build
        if: matrix.platform == 'tv' && (success() || failure())
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/probe_tv_text_input.py
          conditions=DEBUG
          if test -f "$RUNNER_TEMP/tv-typetext-supported"; then conditions="DEBUG CELLULOID_TV_TYPETEXT_SUPPORTED"; fi
          xcodebuild -project CelluloidNative.xcodeproj -scheme CelluloidTV -destination 'generic/platform=tvOS Simulator' -derivedDataPath "$RUNNER_TEMP/celluloid-tv" CODE_SIGNING_ALLOWED=NO SWIFT_ACTIVE_COMPILATION_CONDITIONS="$conditions" build-for-testing 2>&1 | tee "$RUNNER_TEMP/tv-build.log"
          cmp Platforms/tvOS/PrivacyInfo.xcprivacy "$RUNNER_TEMP/celluloid-tv/Build/Products/Debug-appletvsimulator/CelluloidTV.app/PrivacyInfo.xcprivacy"
          plutil -p "$RUNNER_TEMP/celluloid-tv/Build/Products/Debug-appletvsimulator/CelluloidTV.app/PrivacyInfo.xcprivacy"
          test -f "$RUNNER_TEMP/celluloid-tv/Build/Products/Debug-appletvsimulator/CelluloidTV.app/zh-Hans.lproj/InfoPlist.strings"
      - name: Native TV focus and Photos runtime
        if: matrix.platform == 'tv' && ((success() || failure()) && steps.tv_build.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/run_native_tv.py 2>&1 | tee "$RUNNER_TEMP/tv-runtime.log"
      - name: Native Watch build
        id: watch_build
        if: matrix.platform == 'watch' && (success() || failure())
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project CelluloidNative.xcodeproj -scheme CelluloidWatch -destination 'generic/platform=watchOS Simulator' -derivedDataPath "$RUNNER_TEMP/celluloid-watch" CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee "$RUNNER_TEMP/watch-build.log"
      - name: Native Watch runtime
        if: matrix.platform == 'watch' && ((success() || failure()) && steps.watch_build.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/run_native_watch.py 2>&1 | tee "$RUNNER_TEMP/watch-runtime.log"
      - name: Shipping Celluloid companion build
        id: phone_build
        if: matrix.platform == 'phone' && (success() || failure())
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project Celluloid.xcodeproj -scheme CelluloidCompanion -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/celluloid-phone" CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee "$RUNNER_TEMP/phone-build.log"
      - name: Shipping Celluloid companion runtime
        if: matrix.platform == 'phone' && ((success() || failure()) && steps.phone_build.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/run_native_phone.py --shipping 2>&1 | tee "$RUNNER_TEMP/phone-runtime.log"
      - name: Require shipping companion and actual UIKit layer consumer
        if: matrix.platform == 'phone' && (success() || failure())
        shell: bash
        run: |
          python3 Scripts/verify_required_interoperability.py phone --platform-contract --result-bundle "$RUNNER_TEMP/CelluloidPhoneCompanion.xcresult" --runtime-evidence "$RUNNER_TEMP/phone-runtime-evidence.json" --log "$RUNNER_TEMP/phone-runtime-tests.log" --fixtures "$RUNNER_TEMP/mac-fixture-evidence" --output "$RUNNER_TEMP/phone-required-tests.json"
      - name: Native Vision build
        id: vision_build
        if: matrix.platform == 'vision' && (success() || failure())
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project CelluloidNative.xcodeproj -scheme CelluloidVision -destination 'generic/platform=visionOS Simulator' -derivedDataPath "$RUNNER_TEMP/celluloid-vision" CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee "$RUNNER_TEMP/vision-build.log"
      - name: Native Vision install launch and tests
        if: matrix.platform == 'vision' && ((success() || failure()) && steps.vision_build.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/run_native_vision.py 2>&1 | tee "$RUNNER_TEMP/vision-runtime.log"
      - name: Unsigned native generic-device Release packaging
        if: success() || failure()
        shell: bash
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          PROJECT=CelluloidNative.xcodeproj
          case "$NATIVE_PLATFORM" in
            tv) SCHEME=CelluloidTV; DESTINATION=tvOS; PRODUCT=Release-appletvos ;;
            phone) PROJECT=Celluloid.xcodeproj; SCHEME=Celluloid; DESTINATION=iOS; PRODUCT=Release-iphoneos ;;
            watch) SCHEME=CelluloidWatch; DESTINATION=watchOS; PRODUCT=Release-watchos ;;
            vision) SCHEME=CelluloidVision; DESTINATION=visionOS; PRODUCT=Release-xros ;;
            *) exit 2 ;;
          esac
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -destination "generic/platform=$DESTINATION" -derivedDataPath "$RUNNER_TEMP/celluloid-release" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/$NATIVE_PLATFORM-release.log"
          if test "$NATIVE_PLATFORM" = phone; then
            python3 Scripts/verify_embedded_watch.py "$RUNNER_TEMP/celluloid-release/Build/Products/Release-iphoneos/Celluloid.app" "$RUNNER_TEMP/celluloid-release/Build/Products/Release-watchos/CelluloidWatch.app" --mode device --output "$RUNNER_TEMP/phone-embedded-watch-release.json" --build-log "$RUNNER_TEMP/phone-release.log"
            python3 Scripts/verify_native_release.py watch "$RUNNER_TEMP/celluloid-release/Build/Products/Release-watchos/CelluloidWatch.app"
          else
            python3 Scripts/verify_native_release.py "$NATIVE_PLATFORM" "$RUNNER_TEMP/celluloid-release/Build/Products/$PRODUCT/$SCHEME.app"
          fi
      - name: Verify unchanged combined source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/verify_combined_source.py --phase after
          python3 Scripts/verify_native_icon_inputs.py
      - name: Export bounded synthetic evidence
        id: bounded_evidence
        if: always()
