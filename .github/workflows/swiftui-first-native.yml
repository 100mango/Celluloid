# Original Full remains failed. This is its one remaining cold cancellation attempt.
name: Celluloid cold early cancellation evidence
on:
  push:
    branches: [cell-ios-early-cancel-20261015]
permissions:
  contents: read
concurrency:
  group: celluloid-swiftui-first-native
  cancel-in-progress: false
jobs:
  first-slice:
    # SOURCE and CLOSED do not dispatch. Root separately reviews activation.
    if: ${{ true }}
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      EXPECTED_COMMIT: ${{ github.sha }}
      TZ: UTC
      CELLULOID_PREVIEW_CONTINUATION: ''
      CELLULOID_EARLY_CANCEL_SOURCE: 9a25054916700f2e69b12a801b7bbfb81f72d5d6
      CELLULOID_EARLY_CANCEL_SOURCE_TREE: 496e431bc130bb615a820d12672992e558e1b980
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          persist-credentials: false
          fetch-depth: 4
          ref: ${{ github.sha }}
      - name: Verify exact one-attempt cold source
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 100mango/Celluloid
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/cell-ios-early-cancel-20261015
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test -z "${CELLULOID_PREVIEW_CONTINUATION:-}"
          git diff --exit-code HEAD --
          mkdir -p build
          git rev-parse HEAD 'HEAD^{tree}' > build/early-cancel-source.txt
      - name: Cold input-to-home cancellation evidence
        timeout-minutes: 38
        run: |
          set -euo pipefail
          python3 -S Scripts/run_early_cancel_acceptance.py
          python3 -S -c 'import json; r=json.load(open("build/early-cancel-acceptance/acceptance.json")); ok=r.get("validation_scope")=="early_cancel_supplementary" and r.get("current_slice_accepted") is True and r.get("historical_full_38681904126_status")=="failed" and r.get("release_qualification") is False; raise SystemExit(0 if ok else "Supplementary receipt missing or invalid; original Full remains failed")'
      - name: Verify source remained unchanged
        timeout-minutes: 1
        if: always()
        run: git diff --exit-code HEAD --
      - name: Retain native cancellation and cleanup proof
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: celluloid-early-cancel-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/early-cancel-source.txt
            build/early-cancel-acceptance/
          retention-days: 1
          if-no-files-found: error
