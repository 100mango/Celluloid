name: Two Mac Store views on a supported temporary display mode
on:
  push:
    branches: [codex/mac-store-display]
permissions:
  contents: read
concurrency:
  group: celluloid-mac-store-display
  cancel-in-progress: false
jobs:
  capture:
    name: Capture original citrus and coast documents
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - name: Check out exact source and reviewed base
        timeout-minutes: 1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Build once and capture two normal windows
        id: proof
        timeout-minutes: 20
        run: python3 Scripts/mac_store_capture.py
      - name: Admit the full upload and finalization reserve
        id: admit-upload
        if: ${{ always() && steps.proof.outputs.evidence_ready == 'true' }}
        timeout-minutes: 1
        run: python3 Scripts/mac_store_capture.py admit-upload
      - name: Retain original PNGs, opaque RGB copies and bounded proof
        id: upload
        if: ${{ always() && steps.admit-upload.outcome == 'success' && steps.admit-upload.outputs.upload_admitted == 'true' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-store-capture-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mac-store-proof/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
      - name: Verify upload outcome and original evidence clock
        if: ${{ always() && steps.admit-upload.outputs.upload_admitted == 'true' }}
        timeout-minutes: 1
        env:
          CELLULOID_STORE_UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: python3 Scripts/mac_store_capture.py finish-upload
