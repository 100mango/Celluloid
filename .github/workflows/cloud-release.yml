# Manual protected release controller. The checked-in allowlist is disabled
# and empty. A reviewed exact-commit manifest and protected environment
# configuration are required before any signing job can proceed.
name: Owner-approved cloud App Store build
'on':
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact owner-reviewed release allowlist entry
        required: true
        type: string
      mode:
        description: Build export or separate BUILD upload; never App Review/release
        required: true
        default: dry-run
        type: choice
        options: [dry-run, export, upload]
permissions:
  contents: read
  actions: read
concurrency:
  group: owner-cloud-appstore-build
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
  RELEASE_ID: ${{ inputs.release_id }}
  RELEASE_MODE: ${{ inputs.mode }}
  CONTROLLER_DIR: ${{ github.workspace }}/controller-source/.github/release-controller

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && github.repository == '100mango/Celluloid' && github.ref == 'refs/heads/master'
    runs-on: xcode-27
    timeout-minutes: 10
    outputs:
      app_repository: ${{ steps.guard.outputs.app_repository }}
      app_sha: ${{ steps.guard.outputs.app_sha }}
    steps:
      - name: Check out exact workflow controller revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; re-review pin before activation
        with:
          ref: ${{ github.workflow_sha }}
          path: controller-source
          persist-credentials: false
      - name: Validate allowlist and verify exact successful final CI
        id: guard
        env:
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          python3 "$CONTROLLER_DIR/scripts/guard.py" validate --manifest "$CONTROLLER_DIR/release-manifest.json" --release "$RELEASE_ID" --mode "$RELEASE_MODE" --output "$RUNNER_TEMP/release.json"
          python3 "$CONTROLLER_DIR/scripts/guard.py" verify-ci --manifest "$CONTROLLER_DIR/release-manifest.json" --release "$RELEASE_ID" --mode "$RELEASE_MODE"
          python3 - <<'PY'
          import json,os
          r=json.load(open(os.environ['RUNNER_TEMP']+'/release.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('app_repository='+r['repository']+'\napp_sha='+r['commit']+'\n')
          PY

  unsigned_archive:
    if: inputs.mode != 'dry-run'
    needs: verify
    runs-on: xcode-27
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.bridge.outputs.artifact-id }}
      archive_sha256: ${{ steps.build.outputs.archive_sha256 }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: controller-source
          persist-credentials: false
      - name: Check out exact allowlisted app code, with no signing secrets
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ needs.verify.outputs.app_repository }}
          ref: ${{ needs.verify.outputs.app_sha }}
          path: app-source
          persist-credentials: false
          submodules: false
      - name: Revalidate manifest
        run: python3 "$CONTROLLER_DIR/scripts/guard.py" validate --manifest "$CONTROLLER_DIR/release-manifest.json" --release "$RELEASE_ID" --mode "$RELEASE_MODE" --output "$RUNNER_TEMP/release.json"
      - name: Build and verify unsigned archive
        id: build
        env:
          APP_SOURCE: ${{ github.workspace }}/app-source
          RELEASE_JSON: ${{ runner.temp }}/release.json
          OUTPUT_DIR: ${{ runner.temp }}/unsigned-products
        run: bash "$CONTROLLER_DIR/scripts/archive_unsigned.sh"
      - name: Bridge only approved sub-100-MiB unsigned archive to a fresh runner
        id: bridge
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2; re-review pin before activation
        with:
          name: unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unsigned-products/unsigned-archive.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  sign_or_upload:
    if: inputs.mode != 'dry-run'
    needs: [verify, unsigned_archive]
    runs-on: xcode-27
    timeout-minutes: 30
    # Owner review, master-only branch policy, no admin bypass. Sole owner must
    # be allowed to approve their own manual run. Environment creation/config
    # and secret storage require separate approvals before installing this.
    environment: appstore-release
    env:
      SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
      TRUSTED_CONTROLLER_SHA: ${{ vars.TRUSTED_CONTROLLER_SHA }}
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - name: Reject every controller except the immutable owner-approved revision
        run: |
          set -euo pipefail
          test "$SIGNING_ENABLED" = true
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = 100mango/Celluloid
          test "$GITHUB_REF" = refs/heads/master
          test "$GITHUB_SHA" = "$TRUSTED_CONTROLLER_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$TRUSTED_CONTROLLER_SHA"
          [[ "$TRUSTED_CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out trusted immutable harness only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: controller-source
          persist-credentials: false
          sparse-checkout: .github/release-controller
      - name: Recheck CI and prepare toolchain before key materialization
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$CONTROLLER_DIR/scripts/guard.py" verify-ci --manifest "$CONTROLLER_DIR/release-manifest.json" --release "$RELEASE_ID" --mode "$RELEASE_MODE"
          python3 "$CONTROLLER_DIR/scripts/guard.py" verify-credential-metadata --manifest "$CONTROLLER_DIR/release-manifest.json" --release "$RELEASE_ID" --mode "$RELEASE_MODE"
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -version | grep -E '^Xcode 27(\.0)?$'
          xcodebuild -version | grep -F '27A266a'
          xcodebuild -showsdks | grep -F 'iphoneos27.0'
          xcodebuild -help > "$RUNNER_TEMP/xcode-help.txt" 2>&1
          grep -F 'authenticationKeyPath' "$RUNNER_TEMP/xcode-help.txt"
          grep -F 'app-store-connect' "$RUNNER_TEMP/xcode-help.txt"
          grep -F 'manageAppVersionAndBuildNumber' "$RUNNER_TEMP/xcode-help.txt"
          if [ "$RELEASE_MODE" = upload ]; then
            xcrun altool --help > "$RUNNER_TEMP/altool-help.txt" 2>&1
            for flag in API_PRIVATE_KEYS_DIR --upload-app --apiKey --apiIssuer; do grep -F -- "$flag" "$RUNNER_TEMP/altool-help.txt"; done
          fi
      - name: Download only this run's unsigned archive by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0; re-review pin before activation
        with:
          artifact-ids: ${{ needs.unsigned_archive.outputs.artifact_id }}
          path: ${{ runner.temp }}/unsigned-input
          merge-multiple: true
      - name: Validate artifact hash, paths, identity, and metadata before secrets
        env:
          EXPECTED_ARCHIVE_SHA: ${{ needs.unsigned_archive.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          ARCHIVE="$RUNNER_TEMP/unsigned-input/unsigned-archive.tar.gz"
          test "$(shasum -a 256 "$ARCHIVE" | cut -d ' ' -f 1)" = "$EXPECTED_ARCHIVE_SHA"
          python3 "$CONTROLLER_DIR/scripts/guard.py" extract --manifest "$CONTROLLER_DIR/release-manifest.json" --release "$RELEASE_ID" --mode "$RELEASE_MODE" --path "$ARCHIVE" --destination "$RUNNER_TEMP/unsigned-checked"
          python3 "$CONTROLLER_DIR/scripts/guard.py" inspect-archive --manifest "$CONTROLLER_DIR/release-manifest.json" --release "$RELEASE_ID" --mode "$RELEASE_MODE" --path "$RUNNER_TEMP/unsigned-checked/Release.xcarchive"
      - name: Owner-approved cloud export, then optional separately approved BUILD upload
        env:
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          ARCHIVE_PATH: ${{ runner.temp }}/unsigned-checked/Release.xcarchive
        run: bash "$CONTROLLER_DIR/scripts/sign_export.sh"
      - name: Always remove local credentials, profiles and signed outputs
        if: always()
        run: |
          set +x
          rm -rf "$RUNNER_TEMP"/cloud-signing.* "$RUNNER_TEMP/unsigned-input" "$RUNNER_TEMP/unsigned-checked"
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          # Ephemeral hosted runner is discarded. No signed/key/profile artifact
          # upload or cache action is present anywhere in this workflow.
